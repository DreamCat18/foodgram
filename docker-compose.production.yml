version: '3.3'

volumes:
  media_volume: null
  pg_data: null
  static_volume: null

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: dreamcat18/foodgram_backend
    env_file: .env
    depends_on:
      - db
    volumes:
      - static_volume:/collected_static
      - media_volume:/app/media
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "backend.wsgi"]

  frontend:
    image: dreamcat18/foodgram_frontend
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static

  gateway:
    image: dreamcat18/foodgram_gateway
    env_file: .env
    depends_on:
      - backend
      - frontend
    volumes:
      - static_volume:/static
      - media_volume:/media
    ports:
      - 8000:80
