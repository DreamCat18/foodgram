volumes:
  media_volume:
  pg_data:
  static_volume:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: dreamcat18/foodgram_backend
    env_file: .env
    depends_on:
      - db
    volumes:
      - static_volume:/backend_static
      - media_volume:/app/media
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "backend.wsgi"]

  frontend:
    image: dreamcat18/foodgram_frontend
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static

  gateway:
    image: dreamcat18/foodgram_gateway
    depends_on:
      - backend
    volumes:
      - static_volume:/staticfiles
      - media_volume:/media
    ports:
      - 8000:80


