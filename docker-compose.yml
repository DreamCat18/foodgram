version: '3.3'
volumes:
  media: null
  pg_data: null
  static: null
services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      - db
    volumes:
      - static:/backend_static
      - media:/app/media
    command: [ "gunicorn", "--bind", "0.0.0.0:8000", "backend.wsgi" ]
  frontend:
    build: ./frontend/
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static
  gateway:
    build: ./nginx/
    env_file: .env
    depends_on:
      - backend
      - frontend
    volumes:
      - static:/staticfiles
      - media:/media
      - ./nginx/docs:/usr/share/nginx/html/redoc
    ports:
      - 8000:80
