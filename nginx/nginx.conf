server {
  listen 80;
  index index.html;
  server_tokens off;

  location /api/schema/redoc/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/api/schema/redoc/;
  }
  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/api/;
    client_max_body_size 10M;
  }
  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/admin/;
  }
  location /s/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/s/;
  }
  location /Redoc/ {
    alias /usr/share/nginx/html/redoc/;
  }
  location / {
    alias /staticfiles/;
    try_files $uri $uri/ /index.html;
  }
  location /media/ {
    alias /media/;
  }
}
